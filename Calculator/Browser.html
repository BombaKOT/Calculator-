<!DOCTYPE html>
<html lang="en">
<head class="head">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="TheBestFile.css">
    <title>Document</title>
</head>
<body class="body">
    <div class="calaculator_stuff">
        <input class="fred" placeholder="0" type="text">
        <div class="buttons">
            <button class="buttob clear">C</button>
            <button class="buttob all_clear">CE</button>
            <button class="buttob dot action">.</button>
            <button class="buttob one number">1</button>
            <button class="buttob two number">2</button>
            <button class="buttob three number">3</button>
            <button class="buttob four number">4</button>
            <button class="buttob five number">5</button>
            <button class="buttob six number">6</button>
            <button class="buttob seven number">7</button>
            <button class="buttob eight number">8</button>
            <button class="buttob nine number">9</button>
            <button class="buttob zero number">0</button>
            <button class="buttob additon action">+</button>
            <button class="buttob subtraction action">-</button>
            <button class="buttob multiplication action">*</button>
            <button class="buttob division action">/</button>
            <button class="buttob answer">=</button>
        </div>
    </div>
    <script src="YEAAAA.js"></script>
</body>
</html>
